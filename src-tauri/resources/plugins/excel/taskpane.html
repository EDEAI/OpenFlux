<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>OpenFlux Excel Add-in</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script>Office.onReady(function(){try{Office.context.document.settings.set('Office.AutoShowTaskpaneWithDocument',true);Office.context.document.settings.saveAsync();}catch(e){}});</script><script defer="defer" src="taskpane.js"></script></head><body><div id="status-bar" class="status-bar"><span id="status-dot" class="status-dot status-connecting"></span><div class="status-info"><span id="status-text" data-i18n="statusConnecting">Connecting…</span> <span id="reconnect-hint" class="reconnect-hint" style="display:none"></span></div><button id="retry-btn" class="retry-btn" data-i18n="retryBtn" style="display:none">Reconnect</button></div><div class="log-section"><div class="log-header"><span class="log-title" id="log-title" data-i18n="logTitle">📋 Activity Log</span> <button id="clear-btn" class="clear-btn" data-i18n="clearBtn">Clear</button></div><div id="log-box" class="log-box"><div id="empty-hint" class="empty-hint"><div class="empty-icon">🤖</div><div id="empty-hint-text" data-i18n="emptyHint">OpenFlux operations on this file<br>will appear here</div></div></div></div></body></html>
