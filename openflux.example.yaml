#       # enabled: true
#       # timeout: 30
#     - name: ppt
#       transport: stdio
#       command: uvx
#       args: ["--from", "office-powerpoint-mcp-server", "ppt_mcp_server"]

# workspace: .

# ========================
# Voice configuration (STT + TTS)
# ========================
voice:
  stt:
    enabled: false
    # Model directory (optional, automatically searches resources/models/sherpa-onnx/ by default)
    # modelDir: D:\path\to\sherpa-onnx-paraformer-zh-2023-09-14
    # numThreads: 2
  tts:
    enabled: true
    voice: zh-CN-XiaoxiaoNeural    # Default voice character
    rate: "+0%"                     # Speech rate adjustment
    autoPlay: false                 # Whether to automatically play assistant replies

# ========================
# Multi-Agent configuration
# ========================
agents:
  # Routing configuration (automatically analyzes user intent and dispatches to appropriate Agent)
  router:
    enabled: true
    # Routing model (optional, orchestration is reused by default)
    # model:
    #   provider: moonshot
    #   model: kimi-k3

  # Global default configuration (inherited by each Agent)
  defaults:
    tools:
      profile: full
    subagents:
      maxConcurrent: 5
      defaultTimeout: 300
      tools:
        deny:
          - scheduler
          - workflow
          - desktop

  # Agent list
  list:
    - id: default
      default: true
      name: "通用助手"
      description: "处理一般性问题、闲聊、知识问答、信息查询、文本翻译、方案咨询等不涉及文件操作和代码执行的任务"
      tools:
        profile: full

    - id: coder
      name: "编码助手"
      description: "处理编程、文件操作、代码编写、代码重构、脚本执行和数据处理等工程任务（不含独立 PPT 生成与 AI 文生图）"
      tools:
        profile: coding

    - id: presentation
      name: "演示文稿助手"
      description: "专门创建和重新设计独立的 PPTX/PDF 演示文稿，负责资料核验、叙事结构、视觉方向、逐页质检与成果物交付；不处理当前已打开 PowerPoint 的插件编辑"
      tools:
        profile: minimal
        alsoAllow:
          - web_search
          - web_fetch
          - browser
          - file_reader
          - filesystem
          - inspect_presentation_references
          - generate_presentation
          - generate_image
          - notify_user

    - id: automation
      name: "自动化助手"
      description: "处理浏览器网页操作（搜索、网购、采购、下单、表单填写）、桌面应用控制、定时任务、工作流自动化、网页数据抓取等自动化任务"
      tools:
        profile: automation

    # Built-in drawing agent: AI image creation (text-to-image / image-to-image).
    # The image model backend follows the current work mode (standalone/team/managed).
    - id: image
      name: "绘图助手"
      description: "处理文生图、AI绘画、海报/插画/图标/封面图/Logo 生成、按文字描述生成图片，或基于参考图改图/图生图等图像创作任务"
      tools:
        profile: minimal
        alsoAllow:
          - generate_image
          - filesystem

# ========================
# Sandbox isolation configuration
# ========================
sandbox:
  # Execution mode: local (code hardening only) | docker (container isolation)
  mode: local
  # Docker configuration (valid when mode: docker)
  # You need to build the image before use: docker build -f Dockerfile.sandbox -t openflux-sandbox.
  # docker:
  #   image: openflux-sandbox
  #   memoryLimit: 512m
  #   cpuLimit: "1"
  #   networkMode: none # none=disconnect the network, bridge=allow the network
  #   cacheVolumes:
  #     nexus-npm-cache: /root/.npm
  #     nexus-pip-cache: /root/.cache/pip
  #   timeout: 60
  # Command whitelist (optional, only these command prefixes are allowed after setting)
  # allowedCommands:
  #   - node
  #   - npm
  #   - npx
  #   - python
  #   - pip
  #   - git
  #   - conda
  # File extensions that are prohibited from being written (exe/bat/cmd/ps1, etc. are built in by default)
  blockedExtensions:
    - exe
    - bat
    - ps1
    - cmd
    - vbs
    - reg
    - msi

