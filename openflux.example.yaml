# OpenFlux configuration file

# ========================
# LLM Vendor Configuration
# ========================
providers:
  anthropic:
    apiKey: ${ANTHROPIC_API_KEY}
    baseUrl: https://api.anthropic.com

  openai:
    apiKey: ${OPENAI_API_KEY}
    baseUrl: https://api.openai.com/v1

  minimax:
    apiKey: ${MINIMAX_API_KEY}
    # Minimax uses Anthropic compatible interface
    baseUrl: https://api.minimaxi.com/anthropic

  deepseek:
    apiKey: ${DEEPSEEK_API_KEY}
    baseUrl: https://api.deepseek.com/v1

  zhipu:
    apiKey: ${ZHIPU_API_KEY}
    baseUrl: https://open.bigmodel.cn/api/paas/v4

  moonshot:
    apiKey: ${MOONSHOT_API_KEY}
    baseUrl: https://api.moonshot.cn/v1

  google:
    apiKey: ${GOOGLE_API_KEY}
    baseUrl: https://generativelanguage.googleapis.com/v1beta

  ollama:
    baseUrl: http://localhost:11434/v1

# ========================
# LLM usage configuration
# ========================
llm:
  # Main orchestration LLM (for mission planning)
  # Note: Kimi K2.5 does not support custom temperature, only the default value can be used
  orchestration:
    provider: moonshot
    model: kimi-k2.5
    # temperature: not passed, Kimi K2.5 only allows default value
    maxTokens: 4096

  # Execute LLM (for tool calls)
  execution:
    provider: moonshot
    model: kimi-k2.5
    # temperature: not passed, Kimi K2.5 only allows default value
    maxTokens: 4096

  # Embed LLM (used for long-term memory, packaged with the installation package)
  # ------------------------------------------------------------------
  # Default: balanced (packed, vectorDim: 384)
  # model: Xenova/paraphrase-multilingual-MiniLM-L12-v2
  # Size: ~120MB | Language: Balanced Chinese and English | Speed: Fast
  # ------------------------------------------------------------------
  # Optional: Highest performance (requires additional download ~560MB, vectorDim: 1024)
  # model: Xenova/bge-m3
  # ------------------------------------------------------------------
  embedding:
    provider: local
    model: Xenova/paraphrase-multilingual-MiniLM-L12-v2

  # Alternate LLM (optional)
  fallback:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.5

# ========================
# long term memory configuration
# ========================
memory:
  enabled: true
  dbName: openflux_memory.db
  vectorDim: 384
  debug: false
  distillation:
    enabled: true
    startTime: "02:00"
    endTime: "06:00"
    qualityThreshold: 40
    sessionDensityThreshold: 5
    similarityThreshold: 0.85

# ========================
# Remote access configuration
# ========================
remote:
  enabled: false
  port: 18801
  # token: your-secret-token

# ========================
# NexusAI hosting environment configuration (optional)
# ========================
nexusai:
  # It can be changed to the local NexusAI HTTP API address during development.
  apiUrl: https://nexus-api.atyun.com
  # Can be changed to local NexusAI chat WebSocket address during development
  wsUrl: wss://nexus-chat.atyun.com
  # It can be changed to the local Atlas Model Egress gateway root address during development.
  atlasGatewayBaseUrl: https://atlas-gateway.atyun.com/v1/atlas/model-egress

# ========================
# Permission configuration
# ========================
permissions:
  autoApproveLevel: 1
  # allowedDirectories:
  #   - /path/to/your/project     # macOS/Linux
  #   - D:\\YourProject            # Windows
  # blockedDirectories:
  #   - C:\\Windows                # Windows only
  #   - C:\\Program Files          # Windows only

# ========================
# Browser and tool configuration
# ========================
browser:
  enabled: true
  headless: false

opencode:
  enabled: true
  autoApprove: false

# ========================
# Web search and get configuration
# ========================
web:
  search:
    # Search provider: brave or perplexity
    provider: brave
    # Brave Search API Key (Free tier: 2000 requests per month)
    # Application address: https://brave.com/search/api/
    apiKey: ${BRAVE_API_KEY}
    # Default number of results returned
    maxResults: 5
    # Timeout (seconds)
    timeoutSeconds: 30
    # Cache TTL (minutes)
    cacheTtlMinutes: 15
    # Perplexity configuration (effective when provider: perplexity)
    # perplexity:
    #   apiKey: ${PERPLEXITY_API_KEY}
    #   baseUrl: https://api.perplexity.ai
    #   model: perplexity/sonar-pro

  fetch:
    # Whether to enable Readability extraction (default true)
    readability: true
    # Maximum number of characters
    maxChars: 50000
    # Timeout (seconds)
    timeoutSeconds: 30
    # Cache TTL (minutes)
    cacheTtlMinutes: 15
    # Firecrawl configuration (optional, for fallback extraction for JS-intensive websites)
    # firecrawl:
    #   apiKey: ${FIRECRAWL_API_KEY}
    #   baseUrl: https://api.firecrawl.dev
    #   onlyMainContent: true

# ========================
# MCP External Tools Server Configuration
# ========================
# mcp:
#   servers:
#     - name: excel
