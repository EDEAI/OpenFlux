<!doctype html><meta charset="utf-8"><title>OpenFlux native browser test</title>
<style>body{font:16px system-ui;margin:20px}button,input,textarea,select{display:block;margin:12px 0;padding:10px}#scroll{height:100px;width:300px;overflow:auto;background:#eee}#scroll div{height:800px}#drag{margin-top:10px;width:300px;height:80px;background:#def;touch-action:none}</style>
<h1>Native browser fixture</h1><p>测试页面正文 ¥128</p>
<button id="button">Click here</button><form id="form"><input id="input" aria-label="Test input"><textarea id="textarea" aria-label="Next field"></textarea></form>
<select id="select"><option value="one">One</option><option value="two">Two</option></select>
<div id="scroll"><div>Scroll fixture</div></div><div id="drag">Drag fixture</div>
<div style="display:flex;gap:20px;margin-top:12px"><div id="source" draggable="true" style="width:130px;height:50px;background:#def">HTML5 source</div><div id="drop" style="width:130px;height:50px;background:#fed">Drop target</div></div>
<script>
window.results={clicks:0,submitted:0,contexts:0,double:0,moves:0,drags:0,trusted:[],events:[]};
const r=window.results;
for(const type of ['pointerdown','pointerup','pointermove','mousedown','mouseup','click'])document.addEventListener(type,e=>{r.events.push({type,x:e.clientX,y:e.clientY,button:e.button,buttons:e.buttons,target:e.target.id});if(r.events.length>24)r.events.shift()},true);
button.onclick=e=>{r.clicks++;r.trusted.push(e.isTrusted)};
button.ondblclick=e=>{r.double++;e.preventDefault()};
button.oncontextmenu=e=>{r.contexts++;e.preventDefault()};
form.onsubmit=e=>{r.submitted++;e.preventDefault()};
drag.onpointermove=e=>{r.moves++;if(e.buttons)r.drags++;};
drag.onpointerdown=e=>drag.setPointerCapture(e.pointerId);
source.ondragstart=e=>e.dataTransfer.setData('text/plain','native-fixture-payload');
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{e.preventDefault();r.dropped=e.dataTransfer.getData('text/plain')};
</script>
